<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header"><nav class="container nav" aria-label="Primary navigation">
<a class="logo" href="index.html">Daksh Jain</a><ul class="nav-links">
<li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li>

</ul></nav></header>
<main id="main-content">
<section class="container section" aria-labelledby="contact-title">
<p class="eyebrow">Let's connect</p><h1 id="contact-title">Contact Me</h1>
<p>Have a project, opportunity or question? Send me a message.</p>
<form id="contact-form" action="#" method="post" aria-label="Contact form">
<fieldset>
<legend>Your details</legend>
<div class="form-group"><label for="name">Full Name <span aria-hidden="true">*</span></label><input id="name" name="name" type="text" autocomplete="name" required aria-required="true"></div>
<div class="form-group"><label for="email">Email Address <span aria-hidden="true">*</span></label><input id="email" name="email" type="email" autocomplete="email" required aria-required="true"></div>
<div class="form-group"><label for="subject">Subject <span aria-hidden="true">*</span></label><input id="subject" name="subject" type="text" required aria-required="true"></div>
<div class="form-group"><label for="message">Message <span aria-hidden="true">*</span></label><textarea id="message" name="message" rows="7" required aria-required="true"></textarea></div>
<button class="button" type="submit">Send Message</button>
<p id="form-status" role="status" aria-live="polite"></p>
</fieldset>
</form>
</section></main>
